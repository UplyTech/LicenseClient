name: Release

# A tag v* builds, tests, signs and publishes. Order:
#
#   verify          ci.yml, the full test suite
#   build           checks that the tag is on main; npm tarball, wheel and sdist,
#                   SHA256SUMS and provenance.intoto.json, one UplyTech signature
#                   per file (openssl, see release-signing.pub)
#   github-release  GitHub build attestation, the signed artefacts on the GitHub release
#   publish-npm     @uplytech/license-client  (npm publish --provenance)
#   publish-pypi    uplytech-license-client  (pypa/gh-action-pypi-publish)
#
# Only the publishing jobs get id-token: write. Both registries use Trusted
# Publishing (OIDC): no long-lived registry token exists anywhere.
# The publish jobs run in the environment "release" (v* tags only, the owner
# approves each deployment) and only when
# the repository variables PUBLISH_NPM / PUBLISH_PYPI are "true", which the
# owner sets once the Trusted Publisher is configured on the registry (see
# .github/SETTINGS.md). Without them a tag still produces the signed GitHub
# release. Tags count only when the tagged commit is on main. There is no
# manual trigger on purpose: a re-run against another ref would let verify
# test one commit while build publishes a different one.
#
# GitHub-hosted runners: this repository is public, and the organisation runner
# does not serve public repositories. npm Trusted Publishing also only works on
# GitHub-hosted runners. For public repositories these minutes are free.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and sign
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the next step can prove the tag sits on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag
        id: tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Strict semver, so a tag name can never carry shell or path characters further on.
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$tag' is not a v<major>.<minor>.<patch>[-pre] tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=" >> "$GITHUB_OUTPUT" ;; esac

      # Releases come from main only: a tag on a side branch, or on a commit that never reached
      # main, is refused before anything is built or signed.
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::the tagged commit $(git rev-parse HEAD) is not on main"
            exit 1
          fi

      - name: The signing key is configured
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::secret RELEASE_SIGNING_KEY is empty. It is an organisation secret set by the owner; an unsigned release is not created."
            exit 1
          fi

      - name: Build tool image
        run: docker build -q -t ci-polyglot:local .github/ci

      - name: Version and changelog match the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          bash .github/scripts/ci-docker.sh ci-polyglot:local . <<SH
          node .github/scripts/check-versions.mjs --expect "$VERSION"
          grep -qF "## [$VERSION]" CHANGELOG.md || { echo "::error file=CHANGELOG.md::no '## [$VERSION]' section"; exit 1; }
          SH

      - name: Build the artefacts
        run: |
          rm -rf release && mkdir release
          bash .github/scripts/ci-docker.sh ci-polyglot:local . <<'SH'
          node .github/scripts/sync-package-files.mjs
          (cd typescript && npm ci && npm run build && npm pack --pack-destination "$RUNNER_TEMP/../release")
          (cd python && python -m pip install --upgrade pip build twine && python -m build --outdir "$RUNNER_TEMP/../release")
          python -m twine check "$RUNNER_TEMP"/../release/*
          SH

      - name: Checksums and provenance
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -e GITHUB_REPOSITORY -e GITHUB_REF -e GITHUB_SHA -e GITHUB_WORKFLOW_REF -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159 python .github/scripts/release-manifest.py release

      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          key="${RUNNER_TEMP}/release-signing.key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          for f in release/*; do
            case "$f" in *.sig) continue ;; esac
            openssl dgst -sha256 -sign "$key" -out "$f.sig.der" "$f"
            base64 -w0 "$f.sig.der" > "$f.sig"
            rm -f "$f.sig.der"
          done
          openssl dgst -sha256 -verify release-signing.pub -signature <(base64 -d release/SHA256SUMS.sig) release/SHA256SUMS

      - name: Remove the key file
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-signing.key"

      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          awk -v v="## [$VERSION]" 'index($0, v) == 1 { inside = 1; next } inside && /^## \[/ { exit } inside { print }' CHANGELOG.md > release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub release and build attestation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release/*.tgz
            release/*.whl
            release/*.tar.gz

      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: python3 .github/scripts/release-publish.py "$TAG" release release-notes.md $PRERELEASE

  publish-npm:
    name: Publish @uplytech/license-client
    runs-on: ubuntu-latest
    needs: [build, github-release]
    if: vars.PUBLISH_NPM == 'true'
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Nothing is installed here, and a release job must not read a cache
          # another workflow could have written.
          package-manager-cache: false

      # Trusted Publishing needs npm 11.5.1 or newer; Node 24 ships it.
      # A pre-release goes to the "next" dist-tag, never to "latest".
      - name: Publish with provenance
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $v is older than 11.5.1, which Trusted Publishing needs"
            exit 1
          fi
          tag=latest
          if [ -n "$PRERELEASE" ]; then tag=next; fi
          npm publish ./release/*.tgz --provenance --access public --tag "$tag"

  publish-pypi:
    name: Publish uplytech-license-client
    runs-on: ubuntu-latest
    needs: [build, github-release]
    if: vars.PUBLISH_PYPI == 'true'
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: release

      - name: Only the wheel and the sdist go to PyPI
        run: |
          mkdir dist
          cp release/*.whl release/*.tar.gz dist/
          ls -l dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
