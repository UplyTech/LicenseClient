name: Security

# What "security" means for a library: the supply chain (dependencies, actions,
# committed secrets). The scheduled run matters more than the push run: a new
# advisory almost always concerns a dependency that has not changed.
#
# Runs on the own runner, which is root-equivalent on the host (Docker socket).
# Pull requests are therefore not validated automatically: code from a branch,
# Dependabot included, must not run there before a human has read and merged it.
# Validation happens on main after the merge. Tools run in pinned official images
# (see .github/scripts/ci-docker.sh); the host has no node, python or java.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: [self-hosted, server-main]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a token committed three months ago and removed in
          # the next commit is still a valid token.
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 git /repo --redact --exit-code 1

  npm-audit:
    name: npm dependencies
    runs-on: [self-hosted, server-main]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency list and npm audit
        run: |
          bash .github/scripts/ci-docker.sh node:22-bookworm-slim . <<'SH'
          (cd typescript && npm ci)
          # The runtime dependency list is the agreed one
          node .github/scripts/check-dependencies.mjs
          # The dev tree is audited at a level worth acting on.
          (cd typescript && npm audit --audit-level=high)
          SH

  pip-audit:
    name: Python dependencies
    runs-on: [self-hosted, server-main]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency list and pip-audit
        run: |
          bash .github/scripts/ci-docker.sh python:3.12-slim . <<'SH'
          pip install pip-audit
          # The runtime dependency list is the agreed one
          python .github/scripts/check_dependencies.py
          (cd python && pip-audit --strict ".[dev]")
          SH

  osv:
    name: OSV scanner
    runs-on: [self-hosted, server-main]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A second opinion on both lockfiles from a different advisory database.
      - name: osv-scanner
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.2.2 scan source --recursive ./

  actions:
    name: Workflow hygiene
    runs-on: [self-hosted, server-main]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every workflow declares its permissions
        run: |
          failed=0
          for file in .github/workflows/*.yml; do
            grep -q '^permissions:' "$file" || { echo "::error file=$file::no top-level permissions: block"; failed=1; }
          done
          exit $failed

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
