# Reviewed false positives, allowed by value rather than by path, so a real
# secret added to one of the test files is still caught.
#
# The cross-language test vectors need fixed key material: the Ed25519 test key
# pair (two private seeds), the keys the vectors expect to derive from it, and
# one sample licence key. All of it was generated for the vectors, is public in
# this repository on purpose, and signs nothing real.
[extend]
useDefault = true

[[allowlists]]
description = "Test key material of the shared test vectors"
regexTarget = "secret"
regexes = [
  '''^cJ3aJ_6yBBqfzKQ9E-mFO-tLp-mCOm9AKKB7WmpTb2Q$''',
  '''^8bYCRVFVAO3vSlaXfeBSKEsBmzAaosyGZ_35VKnDlDA$''',
  '''^L9zc1Kd7q\+9Pn8MYlhT4/abPE0WvPFSVBGcTGrrzVDg=$''',
  '''^lK9WADmOuqOHPfF8eIlvZpehZXy0f0uBa/pf6dafPLM=$''',
  '''^bpjosssGDs0MK4B6TlNRVq68Tqubp/vpM6CH3MZEX4c=$''',
  '''^ULT-TPM-3F7K9-2QW8M-XZ4RB-W$''',
]
